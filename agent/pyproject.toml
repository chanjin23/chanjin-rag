[project]
name = "rag-agent"
version = "0.1.0"
description = "Windows Sync Agent: 스캔, manifest, 업로드, 백업 수신, URL 프로토콜 (TRD 10장)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
rag-agent = "rag_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_agent"]
