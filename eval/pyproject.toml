[project]
name = "rag-eval"
version = "0.1.0"
description = "평가셋 실행 CLI와 지표 리포트 (PRD 8장, TRD 14장)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
rag-eval = "rag_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_eval"]
