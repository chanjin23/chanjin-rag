[project]
name = "chanjin-rag-backend"
version = "0.1.0"
description = "RAG 플랫폼 API 서버와 Ingestion Worker (TRD 2장, 4장)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "typer>=0.12",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "argon2-cffi>=23.1",
    "openai>=2.50,<3",
    "tenacity>=9.0",
    "httpx>=0.27",
    "pymupdf>=1.26,<2",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "charset-normalizer>=3.3",
    "kiwipiepy>=0.21",
    "tiktoken>=0.8",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[project.scripts]
rag-backend = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
