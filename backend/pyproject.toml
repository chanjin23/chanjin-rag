[project]
name = "chanjin-rag-backend"
version = "0.1.0"
description = "RAG 플랫폼 API 서버와 Ingestion Worker (TRD 2장, 4장)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.scripts]
rag-backend = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
