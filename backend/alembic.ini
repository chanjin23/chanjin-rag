# Alembic config (TRD 3.2 migrate, 12.3). Keep this file ASCII only: Alembic reads it with the
# locale encoding (cp949 on Korean Windows). The DB URL comes from DATABASE_URL (alembic/env.py).
# Run: `uv run rag-backend migrate` anywhere, or `uv run alembic upgrade head` in backend/.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = Asia/Seoul
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
