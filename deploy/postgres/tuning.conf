# ParadeDB(PostgreSQL 17) 조정값 (TRD 12.5). compose.yaml이 /etc/postgresql/tuning.conf로 넣고,
# initdb/10-include-tuning.sh가 postgresql.conf에서 이 파일을 include한다.
# 바꾼 뒤에는 `docker compose restart db`로 반영한다(shared_buffers는 재시작 필요).
shared_buffers = 1GB
# HNSW 색인 생성용
maintenance_work_mem = 1GB
work_mem = 32MB
effective_cache_size = 2GB
timezone = 'Asia/Seoul'
log_timezone = 'Asia/Seoul'
