# web 컨테이너 Nginx 설정 (TRD 3.2, 3.3, 11장). web/Dockerfile이 conf.d/default.conf로 넣는다.
# Compose는 이 컨테이너의 8080만 호스트 127.0.0.1:8080에 연다. 앞단은 `tailscale serve`(HTTPS).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 상한. Sync 설정 max_file_mb(기본 10MB)를 바꾸면 함께 바꾼다(TRD 11장)
    client_max_body_size 12m;

    # 보안 헤더. location 안에서 add_header를 쓰면 이 값들이 상속되지 않으므로 여기에만 둔다.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # 답변 스트림(SSE, TRD 7.3): POST /api/conversations/{id}/messages. 버퍼링하면 토큰이 한꺼번에 온다.
    location ~ ^/api/conversations/[^/]+/messages$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # REST API. Host를 그대로 넘겨야 백엔드의 CSRF Origin 검사(Origin == Host)가 통과한다.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 업로드(최대 12MB)와 백업 내려받기
        proxy_request_buffering on;
        proxy_read_timeout 120s;
    }

    # 빌드 결과의 해시 붙은 파일은 오래 캐시한다
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # SPA: 없는 경로는 index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
